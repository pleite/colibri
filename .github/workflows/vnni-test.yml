name: VNNI GPU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vulkan:
    name: VNNI self-hosted GPU tests
    runs-on: [self-hosted, strix-halo, vulkan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run VNNI tests in Strix Halo podman harness
        working-directory: vnni-int8-matmul
        shell: bash
        env:
          DISPLAY: ${{ env.DISPLAY }}
          WAYLAND_DISPLAY: ${{ env.WAYLAND_DISPLAY }}
          XDG_RUNTIME_DIR: ${{ env.XDG_RUNTIME_DIR }}
        run: |
          set -euo pipefail
          if [ -z "${DISPLAY:-}" ] && [ -z "${WAYLAND_DISPLAY:-}" ]; then
            echo "This workflow requires an active graphical session on the Strix Halo runner." >&2
            exit 1
          fi
          make podman-test

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## VNNI test results"
            echo ""
            if [ -f vnni-int8-matmul/test_output.log ]; then
              echo "### Test output"
              echo ""
              echo '```text'
              tail -n 40 vnni-int8-matmul/test_output.log
              echo '```'
            else
              echo "No test log was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnni-test-artifacts
          path: |
            vnni-int8-matmul/test_output.log
            vnni-int8-matmul/tests/test_backends
            vnni-int8-matmul/tests/vulkan_runtime_test
